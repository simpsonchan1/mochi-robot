<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MOCHI 機械寵物 v0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111e;color:#eaffff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at center,#173a54 0%,#0b192a 58%,#060d18 100%);container-type:size;touch-action:manipulation}#app::after{position:absolute;inset:0;content:"";pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 8px,#0002 9px 10px);opacity:.24}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 4px;z-index:2;flex:none}.logo{font-size:14px;letter-spacing:2px;font-weight:800;color:#93fff1}.status{color:#9cb5c7;font-size:11px;letter-spacing:1px}.top button{background:#142b42;border:1px solid #64e9e96b;border-radius:12px;padding:8px 12px;font-size:12px}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative;gap:4px}.face{width:min(83cqw,680px);height:min(65cqh,290px);display:flex;align-items:center;justify-content:center;gap:min(10cqw,94px);position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}.eye{width:min(24cqw,192px);height:min(44cqh,184px);min-width:46px;min-height:46px;border-radius:43% 43% 49% 49%;background:linear-gradient(160deg,#d0fff8 0%,#80ffe9 48%,#3ab9f5 100%);box-shadow:0 0 17px #76ffff9c,0 0 65px #38d9eb55,inset 0 -12px 28px #138cb844;transition:transform .18s,height .25s,border-radius .25s,background .25s;position:relative;overflow:hidden;display:grid;place-items:center}.eye::before{content:"";position:absolute;top:13%;left:17%;width:25%;height:16%;border-radius:50%;background:#fff9;filter:blur(6px)}.pupil{width:27%;height:34%;background:#12537577;border-radius:50%;transform:translateX(0);transition:transform .25s;position:relative;top:9%}.mouth{position:absolute;bottom:7%;left:50%;width:25px;height:12px;transform:translateX(-50%);border-bottom:4px solid #81fff1;border-radius:50%;opacity:.8;transition:all .2s}.face.blink .eye{transform:scaleY(.07)}.face.happy .eye{transform:scaleY(.55) translateY(18%);border-radius:20% 20% 60% 60%}.face.happy .mouth,.face.love .mouth{width:45px;height:23px}.face.love .eye{background:linear-gradient(145deg,#ffc3ed,#fc72ae);box-shadow:0 0 35px #ff65b77a}.face.surprised .eye{transform:scale(.83,1.13);border-radius:50%}.face.surprised .mouth{height:23px;width:21px;border:4px solid #81fff1;border-radius:50%}.face.sleepy .eye{transform:scaleY(.18);background:#739fba}.face.sleepy .mouth{width:20px;height:20px;border:3px solid #81fff1;border-radius:50%}.face.wiggle{animation:wiggle .55s}.caption{font-size:clamp(12px,2.3cqh,18px);text-align:center;max-width:90%;min-height:24px;letter-spacing:.4px;color:#c6f8f4;pointer-events:none}.controls{z-index:3;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:7px;padding:7px 12px max(12px,env(safe-area-inset-bottom));flex:none}.controls button{background:#123047;border:1px solid #69dbed7a;border-radius:12px;padding:10px 14px;min-height:40px;font-size:13px;font-weight:650}.controls button.active{background:#226f77;border-color:#b1fff2}.controls button:active,.top button:active{transform:scale(.94);background:#306c7f}.help{position:absolute;right:12px;top:48px;background:#0a2032f7;border:1px solid #62e7df88;border-radius:14px;padding:16px;font-size:13px;line-height:1.7;width:min(320px,90%);z-index:6;display:none;box-shadow:0 12px 30px #0009}.help.show{display:block}.help button{float:right;border:0;background:transparent;font-size:20px}.help p{margin:6px 0}.portrait-note{display:none}.test{font-size:10px;color:#82acb7;margin-left:10px}@keyframes wiggle{20%{transform:rotate(-5deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-3deg)}}
/* iOS Safari cannot rotate the hardware viewport. Rotate the entire application instead. */
@media(orientation:portrait){#app{inset:auto;top:0;left:100vw;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg)}.controls{padding-bottom:8px}.top{padding-top:7px}.portrait-note{display:block;position:fixed;bottom:9px;left:10px;color:#b0c3ce;font-size:10px;z-index:9;pointer-events:none}}
@media(max-height:390px) and (orientation:landscape){.top{padding-top:5px}.controls{padding-bottom:5px}.controls button{padding:7px 10px;min-height:32px;font-size:11px}.face{height:min(63cqh,230px)}.eye{height:min(43cqh,145px)}.caption{font-size:11px}}
@media(prefers-reduced-motion:reduce){.face.wiggle{animation:none}}
</style></head>
<body><main id="app"><header class="top"><span class="logo">● MOCHI <span class="status">PET OS v0.2</span></span><span><span id="feedback" class="test">準備就緒</span> <button id="helpButton" type="button">ⓘ 說明</button></span></header><section class="stage"><div id="face" class="face" role="button" tabindex="0" aria-label="摸摸 MOCHI"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div><div class="mouth"></div></div><div id="caption" class="caption" aria-live="polite">你好呀，摸下我隻眼睛！♡</div></section><nav class="controls" aria-label="寵物表情"><button type="button" data-mood="normal" class="active">◉ 平常</button><button type="button" data-mood="happy">☺ 開心</button><button type="button" data-mood="love">♥ 心心</button><button type="button" data-mood="surprised">✦ 驚訝</button><button type="button" data-mood="sleepy">☾ 眼瞓</button><button type="button" id="voiceButton">♪ 聲音：關</button></nav><aside id="helpPanel" class="help"><button type="button" id="closeHelp">✕</button><b>MOCHI v0.2</b><p>摸眼睛：隨機表情同震動。</p><p>左右滑動：眼睛跟住望。</p><p>下方按鈕：直接切換表情。</p><p>聲音預設關閉，按一次開啟（取決於手機是否提供廣東話語音）。</p><p>直向持機時，畫面會自動以橫向版面顯示。網頁不能強制 iPhone 系統旋轉。</p><p>下一階段：ESP32 控制摩打。</p></aside></main><div class="portrait-note">↻ 將手機打橫，操作更方便</div>
<script>
(function(){'use strict';
var face=document.getElementById('face');var caption=document.getElementById('caption');var feedback=document.getElementById('feedback');var voiceButton=document.getElementById('voiceButton');var moodButtons=document.querySelectorAll('[data-mood]');var mood='normal';var sound=false;var restoreTimer=null;var touching=false;var pointerStartX=0;var ignoreClick=false;
var phrases={normal:'你好呀，我係 MOCHI ♡',happy:'耶！我好開心呀！',love:'送個心心俾你 ♡',surprised:'嘩！你嚇親我呀！',sleepy:'Zzz... 我好眼瞓...'};
function speak(text){if(!sound||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=1.02;u.pitch=1.3;window.speechSynthesis.speak(u)}catch(e){feedback.textContent='語音不可用'}}
function setMood(m,announce){if(restoreTimer)clearTimeout(restoreTimer);mood=m;face.className='face'+(m==='normal'?'':' '+m);for(var i=0;i<moodButtons.length;i++){moodButtons[i].classList.toggle('active',moodButtons[i].getAttribute('data-mood')===m)}if(announce!==false){caption.textContent=phrases[m];feedback.textContent='已切換：'+m;speak(phrases[m])}}
function pet(){var choices=['happy','love','surprised'];setMood(choices[Math.floor(Math.random()*choices.length)]);face.classList.add('wiggle');setTimeout(function(){face.classList.remove('wiggle')},550);try{if(navigator.vibrate)navigator.vibrate(25)}catch(e){}restoreTimer=setTimeout(function(){setMood('normal',false)},2300)}
function look(direction){var pupils=document.querySelectorAll('.pupil');for(var i=0;i<pupils.length;i++)pupils[i].style.transform='translateX('+(direction*24)+'px)';caption.textContent=direction>0?'右邊有咩呀？ →':'← 左邊有咩呀？';feedback.textContent='滑動成功';setTimeout(function(){for(var j=0;j<pupils.length;j++)pupils[j].style.transform='translateX(0)'},1100)}
face.addEventListener('pointerdown',function(e){touching=true;pointerStartX=e.clientX});face.addEventListener('pointerup',function(e){if(!touching)return;touching=false;var dx=e.clientX-pointerStartX;if(Math.abs(dx)>35){look(dx>0?1:-1);ignoreClick=true;setTimeout(function(){ignoreClick=false},100)}else{ignoreClick=true;pet();setTimeout(function(){ignoreClick=false},100)}});face.addEventListener('pointercancel',function(){touching=false});face.addEventListener('click',function(){if(!ignoreClick)pet()});face.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pet()}});
for(var i=0;i<moodButtons.length;i++){moodButtons[i].addEventListener('click',function(){setMood(this.getAttribute('data-mood'))})}
voiceButton.addEventListener('click',function(){sound=!sound;voiceButton.textContent=sound?'♪ 聲音：開':'♪ 聲音：關';voiceButton.classList.toggle('active',sound);feedback.textContent=sound?'聲音已開':'聲音已關';if(sound)speak('你好呀，我係 MOCHI');else if('speechSynthesis' in window)window.speechSynthesis.cancel()});
var help=document.getElementById('helpPanel');document.getElementById('helpButton').addEventListener('click',function(){help.classList.toggle('show');feedback.textContent='說明已開啟'});document.getElementById('closeHelp').addEventListener('click',function(){help.classList.remove('show')});
function blink(){if(mood==='normal'||mood==='love'){face.classList.add('blink');setTimeout(function(){face.classList.remove('blink')},130)}setTimeout(blink,2400+Math.random()*3000)}setTimeout(blink,1700);
})();
</script></body></html>
